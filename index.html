<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POAF · LPP">
<meta name="theme-color" content="#0C1E4E">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>POAF · LPP — Thu thập số liệu</title>
<style>
:root{
 --navy:#0C1E4E;--navy2:#14213D;--gold:#E0A32E;--gold-d:#B88600;
 --grey:#5B6577;--grey2:#3A4358;--grey3:#8A93A6;
 --green:#17876B;--green-l:#EEF7F3;--red:#C2334C;--red-l:#FDECEF;
 --blue-l:#EAF0FB;--blue-l2:#F4F6FA;--blue-b:#C7D4EC;
 --page:#F4F6FA;--card:#FFFFFF;--line:#E4EAF4;--fieldbg:#FFFFFF;
 --ink:#14213D;--ink2:#3A4358;--ink3:#8A93A6;--soft:#EAF0FB;--bar:#0C1E4E;
 --warn-bg:#FDF9F0;--warn-ink:#6B5520;--err-bg:#FDECEF;--err-ink:#8C0A20;
 --serif:"Source Serif 4","Source Serif Pro","Times New Roman","Cambria",serif;
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
 --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
 --page:#0D1320;--card:#171F2E;--line:#2A3446;--fieldbg:#1E2839;
 --ink:#E7EDF7;--ink2:#C6D0E0;--ink3:#8593A8;--soft:#222D40;--bar:#080D18;
 --blue-l:#222D40;--blue-l2:#0D1320;--blue-b:#2A3446;
 --green-l:#12332A;--red-l:#3A1620;--red:#F0879C;--green:#5CCFA8;--gold:#F0BE68;
 --warn-bg:#2A2213;--warn-ink:#F0CE8A;--err-bg:#3A1620;--err-ink:#FFB3C0;
 --navy:#E7EDF7;--navy2:#E7EDF7;--grey:#A8B4C6;--grey2:#C6D0E0;--grey3:#8593A8;
 --gold-d:#F0C673;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;background:var(--page)}
body{font-family:var(--sans);background:var(--page);color:var(--ink);font-size:16px;
 -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,.serif{font-family:var(--serif)}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}

#app{display:flex;flex-direction:column;height:100dvh}
.top{background:var(--bar);color:#fff;padding:calc(var(--top) + 10px) 16px 10px;flex:0 0 auto;position:relative;z-index:5}
.top-r{display:flex;align-items:center;gap:12px}
.top .back,.top .menu{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);
 display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;position:relative}
.top .back{font-size:21px}.top .menu{font-size:19px}
.top .back:disabled{opacity:.28}
.top h2{font-size:16px;font-weight:600;line-height:1.2;flex:1;min-width:0;color:#fff}
.top .sub{font-size:11.5px;color:#93A6CC;margin-top:2px;font-family:var(--sans)}
.dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;
 background:#F0879C;border:2px solid var(--bar)}
.prog{height:4px;background:rgba(199,212,236,.22);border-radius:9px;margin-top:11px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .3s}
.steps{display:flex;gap:5px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
 background:rgba(255,255,255,.09);color:#93A6CC;white-space:nowrap}
.chip.on{background:var(--gold);color:#0C1E4E}
.chip.done{background:rgba(23,135,107,.3);color:#8FE0C4}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 8px}
.sec-h{margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
.sec-h h1{font-size:21px;color:var(--ink);line-height:1.25}
.sec-h p{font-size:13px;color:var(--grey);margin-top:5px;line-height:1.5}
.quick{flex:0 0 auto;padding:8px 12px;border-radius:11px;background:var(--soft);
 color:var(--gold-d);font-size:12.5px;font-weight:700;line-height:1.25;text-align:center}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:11px;
 scroll-margin-top:8px}
.q.err{border-color:var(--red);background:var(--err-bg)}
.q.flag{border-color:var(--gold);box-shadow:0 0 0 2px rgba(224,163,46,.18)}
.q .lab{font-size:15px;font-weight:600;color:var(--ink2);line-height:1.35;margin-bottom:3px}
.q .lab .u{font-weight:400;color:var(--ink3);font-size:13.5px}
.q .lab .rq{color:var(--red)}
.q .hint{font-size:12.5px;color:var(--ink3);line-height:1.45;margin-bottom:10px}
.q .msg{font-size:12.5px;color:var(--red);font-weight:600;margin-top:7px}
.q .flagmsg{font-size:12.5px;color:var(--gold-d);font-weight:600;margin-top:7px;line-height:1.5}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.opt{padding:14px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--fieldbg);
 font-size:15.5px;font-weight:600;color:var(--ink2);text-align:center;transition:.12s}
.opt:active{transform:scale(.97)}
.opt.sel{background:var(--navy);border-color:var(--navy);color:var(--page)}
.opt.sel.no{background:var(--grey2);border-color:var(--grey2);color:var(--page)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.opts .opt{text-align:left;padding:13px 15px}

input,textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;
 font-size:17px;font-family:var(--sans);background:var(--fieldbg);color:var(--ink);margin-top:9px;-webkit-appearance:none}
input:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,163,46,.16)}
input[readonly]{background:var(--soft);font-family:var(--serif);font-weight:700;color:var(--ink)}
textarea{min-height:92px;resize:none}
.unit-in{position:relative}
.unit-in .unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);margin-top:4px;
 font-size:14px;color:var(--ink3);pointer-events:none}

.foot{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);
 padding:10px 14px calc(var(--bot) + 10px);display:flex;gap:9px;align-items:center}
.nav{flex:1;padding:16px;border-radius:14px;font-size:16.5px;font-weight:700;text-align:center;transition:.12s}
.nav:active{transform:scale(.98)}
.n1{background:var(--navy);color:var(--page)}
.n2{background:var(--soft);color:var(--ink);flex:0 0 92px}
.n3{background:var(--green);color:#06231B}
.nav:disabled{opacity:.4}

.euro{background:linear-gradient(135deg,#0C1E4E,#1B2C57);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.euro .lab{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#E0A32E;font-weight:700}
.euro .v{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1.05;margin-top:5px;color:#fff}
.euro .v small{font-size:18px;color:#93A6CC;font-weight:400}
.euro .band{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-top:8px}
.eb1{background:rgba(143,224,196,.22);color:#8FE0C4}
.eb2{background:rgba(224,163,46,.22);color:#F3C97A}
.eb3{background:rgba(255,140,160,.2);color:#FF9DAF}
.euro .miss{font-size:13px;color:#FF9DAF;line-height:1.55;margin-top:8px}
.euro .cc{font-size:12.5px;color:#93A6CC;margin-top:9px;line-height:1.5}
.euro details{margin-top:11px;border-top:1px solid rgba(199,212,236,.2);padding-top:9px}
.euro summary{font-size:13px;color:#C7D4EC;font-weight:600}
.euro table{width:100%;font-size:12.5px;margin-top:9px;border-collapse:collapse}
.euro td{padding:4px 0;border-bottom:1px solid rgba(199,212,236,.12);color:#E3EAF6}
.euro td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:#fff}

.sheet{position:fixed;inset:0;background:var(--page);z-index:60;display:flex;flex-direction:column}
.sheet-b{flex:1;overflow-y:auto;padding:16px 14px calc(var(--bot) + 20px);-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px}
.card h3{font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:7px}
.card p,.card li{font-size:13.5px;color:var(--grey);line-height:1.65}
.card ul,.card ol{margin-left:18px;margin-top:5px}
.card b{color:var(--ink2)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.mcard b{display:block;font-family:var(--serif);font-size:26px;color:var(--ink);line-height:1}
.mcard span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.mcard em{font-style:normal;font-size:11.5px;color:var(--gold-d);font-weight:700}
.mcard .pb{height:5px;background:var(--soft);border-radius:9px;margin-top:7px;overflow:hidden}
.mcard .pb i{display:block;height:100%;background:var(--gold)}
.row{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:8px;
 display:flex;align-items:center;gap:11px}
.row:active{background:var(--soft)}
.row .l{flex:1;min-width:0}
.row .l b{font-size:15px;color:var(--ink);display:block}
.row .l span{font-size:12.5px;color:var(--ink3)}
.tag{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;flex:0 0 auto}
.tl{background:var(--green-l);color:var(--green)}.tc{background:var(--red-l);color:var(--red)}
.tw{background:var(--warn-bg);color:var(--gold-d)}
.act{display:flex;flex-direction:column;gap:9px;margin-bottom:13px}
.act button{padding:15px;border-radius:13px;font-size:15.5px;font-weight:700;text-align:center}
.a1{background:var(--green);color:#06231B}
.a2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.a3{background:var(--gold);color:#3A2B08}
.warn{background:var(--warn-bg);border-left:4px solid var(--gold);border-radius:0 11px 11px 0;
 padding:12px 14px;font-size:13px;color:var(--warn-ink);line-height:1.6;margin-bottom:12px}
.errb{background:var(--err-bg);border-left:4px solid var(--red);border-radius:0 11px 11px 0;
 padding:12px 14px;font-size:13.5px;color:var(--err-ink);line-height:1.7;margin-bottom:12px}
.errb button{display:block;text-align:left;color:var(--err-ink);font-size:13.5px;padding:4px 0;
 text-decoration:underline;font-weight:600}
.warn button{display:block;text-align:left;color:var(--warn-ink);font-size:13px;padding:4px 0;
 text-decoration:underline;font-weight:600}
.srch{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
 background:var(--fieldbg);color:var(--ink);font-size:15px;margin:0 0 10px}
.filt{display:flex;gap:7px;margin-bottom:11px;overflow-x:auto;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;
 background:var(--card);border:1px solid var(--line);color:var(--grey)}
.fchip.on{background:var(--navy);color:var(--page);border-color:var(--navy)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 18px);background:var(--bar);color:#fff;
 padding:14px 18px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:99;text-align:center;
 box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(14px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}

.q{border-left:4px solid transparent}
.q.f-done{border-left-color:#17876B;background:var(--card)}
.q.f-todo{border-left-color:#7B4FA8}
.q.f-na{border-left-color:#C7D0DE;opacity:.72}
.q.f-done .lab{color:#17876B}
.q.f-todo .lab{color:#7B4FA8}
.q.f-na .lab{color:var(--ink3)}
html[data-theme="dark"] .q.f-done{border-left-color:#5CCFA8}
html[data-theme="dark"] .q.f-todo{border-left-color:#B48BDC}
html[data-theme="dark"] .q.f-done .lab{color:#5CCFA8}
html[data-theme="dark"] .q.f-todo .lab{color:#B48BDC}
.q.err{border-left-color:var(--red)!important}
.lgd{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);
 border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:12px;color:var(--grey)}
.lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg1{background:#17876B}.lg2{background:#7B4FA8}.lg3{background:#C7D0DE}
.idbox{background:#FFF8F0;border:1px solid #F0D9B8;border-left:4px solid #E0A32E;
 border-radius:0 13px 13px 0;padding:13px 15px;margin-bottom:12px}
html[data-theme="dark"] .idbox{background:#2A2213;border-color:#4A3A1A}
.idb-h{font-family:var(--serif);font-weight:700;font-size:14.5px;color:#8A5A06;margin-bottom:4px}
html[data-theme="dark"] .idb-h{color:#F0CE8A}
.idb-n{font-size:12.5px;color:#6B5520;line-height:1.55}
html[data-theme="dark"] .idb-n{color:#D8C49A}
.idbox label{display:block;font-size:13px;font-weight:600;color:#6B5520;margin-top:10px}
html[data-theme="dark"] .idbox label{color:#D8C49A}
.mkcode{width:100%;margin-top:9px;background:var(--gold);color:#3A2B08;border-radius:11px;padding:13px;
 font-size:15px;font-weight:700;border:0}
.hide{display:none!important}

.pvwrap{overflow:auto;max-height:58vh;border:1px solid var(--line);border-radius:10px;background:var(--card);-webkit-overflow-scrolling:touch}
table.pv{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;font-family:var(--sans)}
table.pv th,table.pv td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 8px;text-align:left;color:var(--ink2)}
table.pv thead th{position:sticky;top:0;background:var(--soft);color:var(--ink);font-weight:700;z-index:2}
table.pv .rn{position:sticky;left:0;background:var(--soft);color:var(--ink);font-weight:700;z-index:1;text-align:center}
table.pv thead .rn{z-index:3}
table.pv td.mt{background:var(--blue-l2)}
.tag.tdemo{background:var(--gold);color:#3A2B08}
.idb-demo{margin-top:12px;display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink2);line-height:1.35}
.idb-demo input{width:21px;height:21px;flex:none;margin:0}

.convrow{display:flex;gap:8px;align-items:stretch;margin-top:2px}
.convrow .unit-in{flex:1;min-width:0}
.convrow .unit-in.alt input{background:var(--soft);border-style:dashed}
.convnote{font-size:12px;color:var(--ink3);margin-top:5px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="top-r">
   <button class="back" id="btnBack" onclick="prevSec()">‹</button>
   <div style="flex:1;min-width:0"><h2 id="secTitle">—</h2><div class="sub" id="secSub">—</div></div>
   <button class="menu" onclick="openMenu()">☰<span class="dot hide" id="bkDot"></span></button>
  </div>
  <div class="prog"><i id="progBar" style="width:0"></i></div>
  <div class="steps" id="steps"></div>
 </div>
 <div class="body" id="body"></div>
 <div class="foot">
  <button class="nav n2" id="btnPrev" onclick="prevSec()">Quay lại</button>
  <button class="nav n1" id="btnNext" onclick="nextSec()">Tiếp tục</button>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* --- Danh mục 96 biến --- */
var YN=["0. Không","1. Có"];
/* Ma phau thuat vien. Bang doi chieu ten giu rieng, khong nam trong ma nguon. */
var PTV=["PTV1","PTV2","PTV3","PTV4","PTV5"];
function ptvCode(v){ return String(v==null?"":v).replace(/\s*\(.*\)\s*$/,""); }
var FIELDS=[
{s:"A",k:"f1",n:"STT",t:"auto"},
{s:"A",k:"f2",n:"Mã số nghiên cứu",t:"txt",req:1,hint:"Tự điền khi nhập ngày phẫu thuật. Muốn đổi thì chỉ cần gõ số thứ tự (ví dụ 7) rồi chạm ra ngoài — app tự thành CR26-007."},
{s:"A",k:"f3",n:"Ngày phẫu thuật",t:"date",req:1},
{s:"F",k:"f4",n:"Phẫu thuật viên chính (mã hóa)",t:"sel",o:PTV,req:1,hint:"Đối chiếu tên với mã theo bảng riêng của nghiên cứu viên. Không ghi tên thật vào đây."},
{s:"A",k:"f5",n:"Ngày thu thập",t:"date"},
{s:"B",k:"f6",n:"Tuổi",u:"năm",t:"num",min:18,max:100,req:1},
{s:"B",k:"f7",n:"Giới tính",t:"sel",o:["0. Nữ","1. Nam"],req:1},
{s:"B",k:"f8",n:"Cân nặng",u:"kg",t:"num",min:25,max:150,dec:1},
{s:"B",k:"f9",n:"Chiều cao",u:"cm",t:"num",min:120,max:200,dec:1},
{s:"B",k:"f10",n:"BMI",u:"kg/m²",t:"calc",hint:"Tự tính từ cân nặng và chiều cao"},
{s:"B",k:"f11",n:"Rối loạn lipid máu",t:"sel",o:YN,hint:"CT>5,2 · TG>1,7 · LDL>2,58 · HDL<1,03 mmol/L, hoặc đang dùng statin"},
{s:"B",k:"f12",n:"Hút thuốc lá",t:"sel",o:YN,hint:"Đang hút hoặc có tiền sử"},
{s:"B",k:"f13",n:"Tăng huyết áp",t:"sel",o:YN},
{s:"B",k:"f14",n:"Đái tháo đường",t:"sel",o:YN,hint:"ADA"},
{s:"B",k:"f15",n:"Bệnh thận mạn",t:"sel",o:YN,hint:"eGFR <60 kéo dài ≥3 tháng (KDIGO)"},
{s:"B",k:"f16",n:"Bệnh phổi mạn",t:"sel",o:YN,hint:"Chủ yếu COPD"},
{s:"B",k:"f17",n:"Bệnh mạch máu ngoại biên",t:"sel",o:YN,hint:"Đau cách hồi · can thiệp mạch ngoại biên · hẹp ≥50% ĐM cảnh"},
{s:"B",k:"f18",n:"Tiền sử PCI",t:"sel",o:YN},
{s:"B",k:"f19",n:"Tiền sử nhồi máu cơ tim",t:"sel",o:YN},
{s:"B",k:"f20",n:"Tiền sử đột quỵ",t:"sel",o:YN},
{s:"B",k:"f21",n:"Phân độ NYHA",t:"sel",o:["1. I","2. II","3. III","4. IV"]},
{s:"B",k:"f22",n:"LVEF",u:"%",t:"num",min:10,max:80,dec:1,hint:"Simpson hai mặt phẳng · giảm khi ≤40%"},
{s:"B",k:"f99",n:"LVEDD",u:"mm",t:"num",min:30,max:90,dec:1,hint:"Trục dọc cạnh ức, CUỐI TÂM TRƯƠNG · giãn khi ≥52,5 mm"},
{s:"B",k:"f23",n:"Đường kính nhĩ trái",u:"mm",t:"num",min:20,max:80,dec:1,hint:"Trục dọc cạnh ức, CUỐI TÂM THU · giãn khi >40 mm"},
{s:"B",k:"f24",n:"Số nhánh ĐMV tổn thương",t:"sel",o:["1. Một","2. Hai","3. Ba nhánh"],hint:"≥50% thân chung hoặc ≥70% nhánh khác"},
{s:"B",k:"f25",n:"Tổn thương thân chung",t:"sel",o:YN,hint:"Hẹp ≥50% đường kính lòng mạch"},

var CRCT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRCT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function u8(s){var o=[],i,cp;for(i=0;i<s.length;i++){cp=s.charCodeAt(i);
 if(cp<0x80)o.push(cp);
 else if(cp<0x800){o.push(0xC0|cp>>6,0x80|cp&63);}
 else if(cp>=0xD800&&cp<0xDC00){var lo=s.charCodeAt(++i),u=0x10000+((cp-0xD800)<<10)+(lo-0xDC00);o.push(0xF0|u>>18,0x80|(u>>12&63),0x80|(u>>6&63),0x80|u&63);}
 else{o.push(0xE0|cp>>12,0x80|(cp>>6&63),0x80|cp&63);} }
 return new Uint8Array(o);}
function zip(files){
 var parts=[],cd=[],off=0;
 function w16(a,v){a.push(v&255,(v>>8)&255);} function w32(a,v){a.push(v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255);}
 files.forEach(function(f){
  var d=u8(f.data), nm=u8(f.name), c=crc32(d), h=[];
  w32(h,0x04034b50); w16(h,20); w16(h,0); w16(h,0); w16(h,0); w16(h,0);
  w32(h,c); w32(h,d.length); w32(h,d.length); w16(h,nm.length); w16(h,0);
  var hb=new Uint8Array(h);
  parts.push(hb,nm,d);
  var e=[];
  w32(e,0x02014b50); w16(e,20); w16(e,20); w16(e,0); w16(e,0); w16(e,0); w16(e,0);
  w32(e,c); w32(e,d.length); w32(e,d.length); w16(e,nm.length); w16(e,0); w16(e,0); w16(e,0); w16(e,0); w32(e,0); w32(e,off);
  cd.push(new Uint8Array(e),nm);
  off+=hb.length+nm.length+d.length;
 });
 var cdlen=cd.reduce(function(a,b){return a+b.length;},0), end=[];
 w32(end,0x06054b50); w16(end,0); w16(end,0); w16(end,files.length); w16(end,files.length);
 w32(end,cdlen); w32(end,off); w16(end,0);
 var all=parts.concat(cd,[new Uint8Array(end)]);
 var tot=all.reduce(function(a,b){return a+b.length;},0), out=new Uint8Array(tot), p=0;
 all.forEach(function(a){out.set(a,p);p+=a.length;});
 return out;
}

function isReal(c){return !c._demo;}

/* ============ SÀNG LỌC TIÊU CHUẨN ============ */
function screenVerdict(c){
  c=c||null;
  function g(k){ return c ? (c[k]===undefined||c[k]===null?'':String(c[k]).trim()) : val(k); }
  var miss=[], bad=[];
  FIELDS.forEach(function(f){
    if(!f.scr) return;
    var v=g(f.k);
    if(!v){ miss.push(f.n); return; }
    if(f.inc && v==='0. Không') bad.push('Không thỏa: '+f.n);
    if(f.exc && v==='1. Có')    bad.push(f.n);
  });
  var verdict = bad.length ? 'Loại trừ' : (miss.length ? 'Chưa đủ thông tin' : 'Nhận vào');
  return {verdict:verdict, miss:miss, reasons:bad, reason:bad.join(' · ')};
}
function isExcluded(c){ return screenVerdict(c).verdict==='Loại trừ'; }
function applyScreen(){
  var r=screenVerdict();
  setv('f97', r.verdict==='Chưa đủ thông tin' ? '' : r.verdict);
  setv('f98', r.reason);
  return r;
}

/* --- EuroSCORE II (Nashef 2012) --- */
var ES_B0=-5.324537;
function ccGault(){
  var age=parseFloat(val('f6')), wt=parseFloat(val('f8')), cr=parseFloat(val('f76')), sex=val('f7');
  if(!(age>0&&wt>0&&cr>0)) return null;
  var cc=(140-age)*wt/(0.814*cr);
  if(sex==='0. Nữ') cc*=0.85;
  return cc;
}
function euroscore(){
  var T=[], miss=[];
  function need(k,label){ if(!val(k)){ miss.push(label); return false; } return true; }
  var age=parseFloat(val('f6'));
  if(!(age>0)) miss.push('Tuổi'); else T.push(['Tuổi '+age, 0.0285181*(age<=60?1:age-59)]);
  var sex=val('f7');
  if(!sex) miss.push('Giới tính'); else if(sex==='0. Nữ') T.push(['Giới nữ',0.2196434]);
  if(need('f75','Đái tháo đường phụ thuộc insulin') && val('f75')==='1. Có') T.push(['Đái tháo đường phụ thuộc insulin',0.3542749]);
  if(need('f17','Bệnh mạch máu ngoại biên') && val('f17')==='1. Có') T.push(['Bệnh mạch máu ngoài tim',0.5360268]);
  if(need('f16','Bệnh phổi mạn') && val('f16')==='1. Có') T.push(['Bệnh phổi mạn',0.1886564]);
  if(need('f79','Suy giảm vận động nặng') && val('f79')==='1. Có') T.push(['Suy giảm vận động nặng',0.2407181]);
  var cc=ccGault(), dial=val('f78');
  if(!dial) miss.push('Đang lọc máu định kỳ');
  else if(dial==='1. Có') T.push(['Đang lọc máu định kỳ',0.6421508]);
  else if(cc===null) miss.push('Creatinin máu trước mổ');
  else if(cc<=50) T.push(['Thanh thải creatinin ≤50',0.8592256]);
  else if(cc<=85) T.push(['Thanh thải creatinin 50–85',0.303553]);
  if(need('f80','Viêm nội tâm mạc đang hoạt động') && val('f80')==='1. Có') T.push(['Viêm nội tâm mạc đang hoạt động',0.6194522]);
  if(need('f81','Tình trạng nguy kịch trước mổ') && val('f81')==='1. Có') T.push(['Tình trạng nguy kịch trước mổ',1.086517]);
  var ny=val('f21');
  if(!ny) miss.push('Phân độ NYHA');
  else if(ny==='2. II') T.push(['NYHA II',0.1070545]);
  else if(ny==='3. III') T.push(['NYHA III',0.2958358]);
  else if(ny==='4. IV') T.push(['NYHA IV',0.5597929]);
  if(need('f82','Đau thắt ngực CCS độ 4') && val('f82')==='1. Có') T.push(['Đau thắt ngực CCS 4',0.2226147]);
  var ef=parseFloat(val('f22'));
  if(!(ef>0)) miss.push('LVEF');
  else if(ef<=20) T.push(['LVEF ≤20% (rất kém)',0.9346919]);
  else if(ef<=30) T.push(['LVEF 21–30% (kém)',0.8084096]);
  else if(ef<=50) T.push(['LVEF 31–50% (trung bình)',0.3150652]);
  if(need('f83','Nhồi máu cơ tim trong vòng 90 ngày') && val('f83')==='1. Có') T.push(['Nhồi máu cơ tim ≤90 ngày',0.1528943]);
  var pa=parseFloat(val('f84'));
  if(!(pa>0)) miss.push('Áp lực động mạch phổi tâm thu');
  else if(pa>=55) T.push(['Áp lực ĐMP ≥55 mmHg',0.3491475]);
  else if(pa>=31) T.push(['Áp lực ĐMP 31–55 mmHg',0.1788899]);
  var ur=val('f30');
  if(!ur) miss.push('Mức độ khẩn phẫu thuật');
  else if(ur==='1. Bán cấp') T.push(['Mổ bán cấp',0.3174673]);
  else if(ur==='2. Cấp cứu') T.push(['Mổ cấp cứu',0.7039121]);
  else if(ur==='3. Cứu vãn') T.push(['Mổ cứu vãn',1.362947]);
  var y=ES_B0; T.forEach(function(t){y+=t[1];});
  var p=Math.exp(y)/(1+Math.exp(y))*100;
  return {pct:p, y:y, terms:T, miss:miss, cc:cc};
}

function paintFieldStates(){

  FIELDS.forEach(function(f){
    var st=fieldState(f);
    if(st==='f-done')done++; else if(st==='f-todo')todo++;
    var box=document.getElementById('q_'+f.k); if(!box)return;
    box.classList.remove('f-done','f-todo','f-na'); box.classList.add(st);
  });
  var el=document.getElementById('lgdCnt');
  if(el) el.textContent='Cả ca: đã điền '+done+' · còn '+todo;
}
function paintOne(k){
  var f=fld(k), box=document.getElementById('q_'+k); if(!box)return;
  var btns=box.querySelectorAll('.opt'), v=val(k), yn=(f.o&&f.o.length===2&&f.o[0].indexOf('Không')>0);
  f.o.forEach(function(o,i){ var b=btns[i]; if(!b)return;
    b.className='opt'+(v===o?' sel'+(yn&&i===0?' no':''):''); });
  paintFieldStates();
}
function paintCalc(k){
  var box=document.getElementById('q_'+k); if(!box)return;
  var inp=box.querySelector('input[readonly]'); if(inp)inp.value=val(k);
}
function paintEuroIfVisible(){ if(SECS[si]==='H')paintEuro(); }
function validate(k){
  var f=fld(k), box=document.getElementById('q_'+k), m=document.getElementById('m_'+k);
  if(!box)return true; box.classList.remove('err'); if(m)m.textContent='';
  var v=val(k); if(!v||f.t!=='num')return true;
  var x=parseFloat(v.replace(',','.'));
  if(isNaN(x)){box.classList.add('err');m.textContent='Không phải số';return false;}
  if(f.min!==undefined&&(x<f.min||x>f.max)){box.classList.add('err');
    m.textContent='Ngoài khoảng hợp lý '+f.min+'–'+f.max;return false;}
  return true;
}
function paintEuro(){
  var el=document.getElementById('euroBox'); if(!el)return;
  var r=euroscore(), cc=ccGault();
  if(r.miss.length){ el.innerHTML='<div class="lab">EuroSCORE II</div><div class="v">—</div>'
    +'<div class="miss">Còn thiếu: '+r.miss.join(' · ')+'</div>'; return; }
  var p=Math.round(r.pct*100)/100;
  var b=p<2?['eb1','Nguy cơ thấp']:(p<5?['eb2','Nguy cơ trung bình']:['eb3','Nguy cơ cao']);
  el.innerHTML='<div class="lab">EuroSCORE II — tử vong nội viện dự đoán</div>'
   +'<div class="v">'+p.toFixed(2)+'<small> %</small></div>'
   +'<div class="band '+b[0]+'">'+b[1]+'</div>'
   +'<div class="cc">Thanh thải creatinin '+(cc===null?'—':(Math.round(cc*10)/10)+' mL/phút')
   +' · tổng hệ số β '+r.y.toFixed(4)+'</div>'
   +'<details><summary>Xem các yếu tố đang được tính</summary><table>'
   +'<tr><td>Hằng số mô hình</td><td>'+ES_B0.toFixed(4)+'</td></tr>'
   +r.terms.map(function(t){return '<tr><td>'+t[0]+'</td><td>'+t[1].toFixed(4)+'</td></tr>';}).join('')
   +'</table><div class="cc">Mổ tim lại · động mạch chủ ngực · mức độ nặng can thiệp luôn bằng 0 do tiêu chuẩn loại trừ.</div></details>';
}
function lockHtml(){
  var miss=FIELDS.filter(function(f){return f.gate&&depOK(f)&&!val(f.k);}).map(function(f){return f.n;});
  return '<div class="warn">Phần này bị khóa cho tới khi ghi xong kết cục. Theo mục 2.6.3, biên bản phẫu thuật chỉ được mở sau cùng để người trích xuất không biết ca thuộc nhóm nào trong lúc đánh giá POAF.</div>'
   +(miss.length?'<div class="errb"><b>Còn thiếu:</b><br>• '+miss.join('<br>• ')+'</div>':'')
   +'<div class="act"><button class="'+(miss.length?'a2':'a3')+'" onclick="unlockF()">'
   +(miss.length?'Chưa đủ — quay lại điền tiếp':'Đã xong kết cục — mở biên bản phẫu thuật')+'</button></div>';
}
function unlockF(){
  var miss=FIELDS.filter(function(f){return f.gate&&depOK(f)&&!val(f.k);});
  if(miss.length){ goSec(SECS.indexOf(miss[0].s)); toast('Còn thiếu: '+miss[0].n); return; }
  unlocked=true; cur._unlockedAt=new Date().toISOString(); logAdd('unlockF',val('f2'),null,''); persist(); save(); render();
  toast('Đã mở phần trong mổ');
}


/* ============ KIỂM TRA LOGIC CHÉO ============ */
function crossChecks(c){
  c=c||cur; var W=[];
  function v(k){return (c[k]===undefined||c[k]===null)?'':String(c[k]).trim();}
  function n(k){var x=parseFloat(String(v(k)).replace(',','.'));return isNaN(x)?null:x;}
  if(v('f59')==='1. Có' && v('f70')==='0. Không')
    W.push(['f70','Đã làm cửa sổ màng tim vào khoang màng phổi trái nhưng ghi không mở màng phổi — xem lại biên bản.']);
  if(v('f59')==='1. Có' && v('f71')==='2. Phải')
    W.push(['f71','Cửa sổ mở vào khoang màng phổi TRÁI nhưng chỉ ghi mở màng phổi phải.']);
  if(v('f31')==='0. Không'){
    ['f37','f38','f39','f40','f41'].forEach(function(k){
      if(v(k)==='1. Có') W.push([k,'Ghi không có POAF nhưng lại có điều trị rung nhĩ.']); });
  }
  if(v('f44')==='0. Không' && v('f46') && v('f46').indexOf('0. Không tràn dịch')!==0)
    W.push(['f46','Ghi không tràn dịch màng tim nhưng lại có vị trí tràn dịch.']);
  if(v('f44')==='0. Không' && v('f47')==='1. Có')
    W.push(['f47','Không tràn dịch nhưng lại cần can thiệp dẫn lưu.']);
  if(v('f58')==='1. Có' && v('f34')==='1. Có')
    W.push(['f34','Tử vong nội viện nhưng ghi đã hồi phục nhịp xoang khi xuất viện.']);
  var on=n('f32'), los=n('f53');
  if(on!==null && los!==null && on>los)
    W.push(['f32','Ngày khởi phát POAF ('+on+') muộn hơn ngày xuất viện ('+los+').']);
  var icu=n('f52'), vent=n('f51');
  if(icu!==null && los!==null && icu>los) W.push(['f52','Thời gian nằm hồi sức dài hơn thời gian nằm viện.']);
  if(vent!==null && icu!==null && vent/24 > icu+0.5) W.push(['f51','Thời gian thở máy dài hơn thời gian nằm hồi sức.']);
  if(v('f62')==='1. Có' && v('f61')==='0. Không')
    W.push(['f61','Ghi cầu nối toàn động mạch nhưng không dùng động mạch ngực trong.']);
  var ef=n('f22');
  if(ef!==null && ef<=30 && v('f21')==='1. I')
    W.push(['f21','LVEF '+ef+'% nhưng phân độ NYHA I — kiểm tra lại.']);
  if(v('f14')==='0. Không' && v('f75')==='1. Có')
    W.push(['f75','Ghi không đái tháo đường nhưng lại phụ thuộc insulin.']);
  if(v('f15')==='0. Không' && v('f78')==='1. Có')
    W.push(['f78','Ghi không bệnh thận mạn nhưng đang lọc máu định kỳ.']);
  if(v('f19')==='0. Không' && v('f83')==='1. Có')
    W.push(['f83','Ghi không có tiền sử nhồi máu cơ tim nhưng lại có nhồi máu trong 90 ngày.']);
  if(v('f24')==='1. Một' && n('f60')!==null && n('f60')>=3)
    W.push(['f60','Chỉ tổn thương một nhánh nhưng có '+n('f60')+' miệng nối.']);
  return W;
}
function paintFlags(){
  var W=crossChecks(), on={};
  W.forEach(function(w){on[w[0]]=w[1];});
  FIELDS.forEach(function(f){
    var box=document.getElementById('q_'+f.k); if(!box)return;
    var old=box.querySelector('.flagmsg'); if(old)old.remove();
    box.classList.remove('flag');
    if(on[f.k]){ box.classList.add('flag');
      var d=document.createElement('div'); d.className='flagmsg'; d.textContent='⚠︎ '+on[f.k];
      box.appendChild(d); }
  });
}


/* ============ RÀ SOÁT TRƯỚC KHI LƯU ============ */
function missingList(){
  return FIELDS.filter(function(f){
    if(f.t==='calc'||f.t==='auto'||f.t==='area')return false;
    if(!depOK(f))return false;
    if(f.s==='F'&&!unlocked)return false;
    return val(f.k)==='';
  });
}
function reviewHtml(){
  var miss=missingList(), W=crossChecks(), h='';
  var req=miss.filter(function(f){return f.req;});
  if(req.length){
    h+='<div class="errb"><b>Bắt buộc, chưa điền — chạm để tới:</b>'
     +req.map(function(f){return '<button onclick="jumpTo(\''+f.k+'\')">'+f.n+' →</button>';}).join('')
     +'</div>';
  }
  if(W.length){
    h+='<div class="warn"><b>'+W.length+' điểm cần xem lại — chạm để tới:</b>'
     +W.map(function(w){var f=fld(w[0]);return '<button onclick="jumpTo(\''+w[0]+'\')">'+f.n+': '+w[1]+'</button>';}).join('')
     +'</div>';
  }
  var opt=miss.filter(function(f){return !f.req;});
  if(opt.length){
    h+='<div class="warn"><b>Còn '+opt.length+' biến chưa điền (không bắt buộc):</b>'
     +opt.slice(0,12).map(function(f){return '<button onclick="jumpTo(\''+f.k+'\')">'+f.n+' →</button>';}).join('')
     +(opt.length>12?'<div style="padding-top:5px">…và '+(opt.length-12)+' biến khác</div>':'')
     +'</div>';
  }
  if(!req.length&&!W.length&&!opt.length)
    h+='<div class="warn" style="border-left-color:var(--green);background:var(--green-l);color:var(--green)">'
      +'<b>Đã điền đủ 84 biến, không phát hiện mâu thuẫn.</b> Bấm Lưu ca này.</div>';
  var l=0,c2=0; included().forEach(function(x){if(x.f59==='1. Có')l++;else if(x.f59==='0. Không')c2++;});
  h+='<div class="card"><h3>Tiến độ sau khi lưu ca này</h3><p>'
   +'Nhóm LPP <b>'+(l+(val('f59')==='1. Có'?1:0))+'/'+TARGET+'</b> · '
   +'Nhóm chứng <b>'+(c2+(val('f59')==='0. Không'?1:0))+'/'+TARGET+'</b></p></div>';
  return h;
}
function jumpTo(k){
  var f=fld(k); if(!f)return;
  si=SECS.indexOf(f.s); render();
  setTimeout(function(){
    var el=document.getElementById('q_'+k);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('flag'); }
  },90);
}
/* ============ NHẮC SAO LƯU ============ */
function sinceBackup(){
  if(!DB.lastBackup) return DB.cases.length?999:0;
  return Math.max(0, DB.cases.length - (DB.backupAt||0));
}
function backupDue(){ return sinceBackup()>=10 || (DB.lastBackup && (Date.now()-DB.lastBackup)>7*864e5 && DB.cases.length>(DB.backupAt||0)); }
function paintDot(){ var d=document.getElementById('bkDot'); if(d) d.classList.toggle('hide',!backupDue()); }

/* ================= ĐIỀU HƯỚNG ================= */
function goSec(i){ if(i<0||i>=SECS.length)return; si=i; render(); }
function prevSec(){ if(si>0){si--;render();} }
function nextSec(){
  var s=SECS[si];
  if(s==='S'){
    var sv=screenVerdict();
    if(sv.verdict==='Chưa đủ thông tin'){ toast('Còn '+sv.miss.length+' tiêu chuẩn chưa đối chiếu'); return; }
  }
  var bad=secFields(s).filter(depOK).filter(function(f){return !validate(f.k);});
  if(bad.length){ toast('Kiểm tra lại: '+bad[0].n); return; }
  if(s==='F'&&!unlocked){ unlockF(); return; }
  if(si<SECS.length-1){ si++; render(); } else saveCase();
}

/* ================= LƯU CA ================= */
function nextStt(){var m=0;allCases().forEach(function(c){var n=parseInt(c.f1||0,10);if(n>m)m=n;});return m+1;}
function save(){ if(curIdx<0){DB.draft={data:cur,unlocked:unlocked};persist();} }
function newCase(){
  cur={}; curIdx=-1; unlocked=false; si=0; DB.draft=null; persist();
  cur.f1=String(nextStt()); cur.f5=new Date().toISOString().slice(0,10);
  render(); closeSheet();
}
function saveCase(){
  var errs=[]; var sc=applyScreen();
  FIELDS.forEach(function(f){
    if(!depOK(f))return;
    if(f.t==='num'&&val(f.k)){ var x=parseFloat(val(f.k).replace(',','.'));
      if(isNaN(x)||(f.min!==undefined&&(x<f.min||x>f.max))) errs.push(f.n+': ngoài khoảng hợp lý'); }
  });
  if(sc.verdict==='Chưa đủ thông tin') errs.push('Chưa đối chiếu xong tiêu chuẩn sàng lọc');
  if(sc.verdict==='Loại trừ'){
    if(!val('f2')) errs.push('Thiếu: Mã số nghiên cứu');
    if(!val('f3')) errs.push('Thiếu: Ngày phẫu thuật');
  } else if(sc.verdict==='Nhận vào'){
    FIELDS.forEach(function(f){ if(depOK(f)&&f.req&&!val(f.k)) errs.push('Thiếu: '+f.n); });
    if(!unlocked) errs.push('Chưa mở phần F — thiếu biến LPP thì không xếp nhóm được');
  }
  DB.cases.forEach(function(c,i){ if(i!==curIdx&&c.f2&&c.f2===val('f2')) errs.push('Mã số "'+val('f2')+'" đã có ở ca khác'); });
  if(errs.length){ showErrs(errs); return; }
  recompute(); cur._savedAt=new Date().toISOString();
  if(curIdx>=0){
    var oldc=DB.cases[curIdx], chg=diffCase(oldc,cur);
    var risky = !!cur._unlockedAt && chg.some(function(d){return isOutcomeK(d[0]);});
    DB.cases[curIdx]=cur;
    if(chg.length) logAdd('edit',val('f2'),chg,risky?'Sửa biến kết cục SAU khi đã mở mục F':'');
    toast('Đã cập nhật ca '+val('f2'));}
  else {DB.cases.push(cur);logAdd('create',val('f2'),null,'');toast(sc.verdict==='Loại trừ'
    ? ('Đã ghi ca loại trừ '+val('f2'))
    : ('Đã lưu ca '+val('f2')+' — '+included().length+' ca nhận vào'));}
  DB.draft=null; persist(); newCase();
}
function showErrs(errs){
  var f=errs[0], k=null;
  FIELDS.forEach(function(x){ if(!k&&f.indexOf(x.n)>=0)k=x; });
  var h='<div class="errb"><b>Chưa lưu được:</b><br>• '+errs.join('<br>• ')+'</div>';
  document.getElementById('body').insertAdjacentHTML('afterbegin',h);
  document.getElementById('body').scrollTop=0;
  if(k){ toast('Nhấn để tới: '+k.n); setTimeout(function(){goSec(SECS.indexOf(k.s));},1400); }
}
function editCase(i){ cur=JSON.parse(JSON.stringify(DB.cases[i])); curIdx=i; unlocked=true; si=0;
  render(); closeSheet(); }
function delCase(i){
  var c=DB.cases[i];
  if(!confirm('Xóa ca '+(c.f2||'')+'?\n\nCa được chuyển vào thùng rác — vẫn khôi phục được và vẫn nằm trong nhật ký.'))return;
  if(!DB.trash)DB.trash=[];
  c._deletedAt=new Date().toISOString(); DB.trash.push(c); DB.cases.splice(i,1);
  logAdd('del',c.f2,null,c._demo?'ca mẫu':''); persist(); toast('Đã chuyển vào thùng rác'); openMenu();
}
function restoreCase(i){
  var c=DB.trash[i]; if(!c)return;
  delete c._deletedAt; DB.cases.push(c); DB.trash.splice(i,1);
  logAdd('restore',c.f2,null,''); persist(); toast('Đã khôi phục '+(c.f2||'')); openMenu();
}
function openTrash(){
  var T=DB.trash||[];
  if(!T.length){ toast('Thùng rác trống'); return; }
  var h='<div class="card"><h3>'+T.length+' ca đã xóa</h3><p style="color:var(--ink3);font-size:13px">Ca trong thùng rác không vào thống kê và không vào file Excel, nhưng mã số của chúng không bị cấp lại.</p></div>';
  h+=T.map(function(c,i){
    return '<div class="row"><div class="l"><b>'+(c.f2||'(chưa có mã)')+(c._demo?' · MẪU':'')+'</b>'
     +'<span>'+(c.f3||'')+' · xóa lúc '+fmtT(c._deletedAt)+'</span></div>'
     +'<button class="a3" style="padding:6px 12px;font-size:13px" onclick="restoreCase('+i+')">Khôi phục</button></div>';
  }).join('');
  sheet('Thùng rác', T.length+' ca', h);
}
function openLog(){
  var L=(DB.log||[]).slice().reverse();
  if(!L.length){ toast('Nhật ký còn trống'); return; }
  var h='<div class="card"><h3>'+L.length+' thao tác</h3><p style="color:var(--ink3);font-size:13px">Nhật ký được xuất kèm file Excel ở sheet <b>NhatKy</b>. Mục màu đỏ là lần sửa biến kết cục sau khi đã mở biên bản phẫu thuật.</p></div>';
  h+=L.map(function(e){
    var risky=!!e.note && e.note.indexOf('SAU khi')>=0;
    var x='<div class="'+(risky?'errb':'card')+'" style="margin-bottom:8px">'
     +'<b>'+(ACT[e.act]||e.act)+(e.code?' · '+e.code:'')+'</b>'
     +'<div style="color:var(--ink3);font-size:12px;margin-top:2px">'+fmtT(e.t)+(e.dev?' · '+e.dev:'')+'</div>';
    if(e.note) x+='<div style="font-size:13px;margin-top:4px"><b>'+esc(e.note)+'</b></div>';
    if(e.chg) x+='<div style="font-size:12px;margin-top:5px;line-height:1.55">'+e.chg.map(function(d){
      return esc(d[1])+': '+(d[2]===''?'(trống)':esc(d[2]))+' → '+(d[3]===''?'(trống)':esc(d[3]));}).join('<br>')+'</div>';
    return x+'</div>';
  }).join('');
  sheet('Nhật ký thao tác', L.length+' bản ghi', h);
}

/* ================= MÀN HÌNH PHỤ ================= */
function sheet(title,sub,html){
  var d=document.createElement('div'); d.className='sheet'; d.id='sheet';
  d.innerHTML='<div class="top"><div class="top-r">'
   +'<button class="back" onclick="closeSheet()">‹</button>'
   +'<div style="flex:1;min-width:0"><h2>'+title+'</h2><div class="sub">'+sub+'</div></div>'
   +'</div></div><div class="sheet-b">'+html+'</div>';
  closeSheet(); document.body.appendChild(d);
}
function closeSheet(){var d=document.getElementById('sheet');if(d)d.remove();}
var FQ='', FMODE='all';
function setFQ(v){FQ=v;renderRows();}
function setFM(m){FMODE=m;openMenu();}
function caseStats(c){
  var tot=0,fi=0; FIELDS.forEach(function(f){ if(f.t==='auto'||f.t==='calc')return;
    if(f.dep&&c[f.dep[0]]!==f.dep[1])return; tot++; if(c[f.k])fi++; });
  return {tot:tot,fi:fi,done:fi===tot,warn:crossChecks(c).length};
}
function renderRows(){
  var el=document.getElementById('rows'); if(!el)return;
  var q=FQ.toLowerCase();
  var list=DB.cases.map(function(c,i){return {c:c,i:i};}).filter(function(o){
    var c=o.c, st=caseStats(c);
    if(FMODE==='exc') return c.f97==='Loại trừ';
    if(FMODE!=='all'&&c.f97==='Loại trừ') return false;
    if(FMODE==='lpp'&&c.f59!=='1. Có')return false;
    if(FMODE==='ctl'&&c.f59!=='0. Không')return false;
    if(FMODE==='inc'&&st.done&&!st.warn)return false;
    if(FMODE==='poaf'&&c.f31!=='1. Có')return false;
    if(!q)return true;
    return [(c.f2||''),(c._name||''),(c._rec||''),(c.f3||''),(c.f4||''),(c.f6||'')].join(' ').toLowerCase().indexOf(q)>=0;
  }).reverse();
  if(!list.length){ el.innerHTML='<div class="card"><p>Không có ca nào khớp.</p></div>'; return; }
  el.innerHTML=list.map(function(o){
    var c=o.c, st=caseStats(c);
    var tag=c._demo?'<span class="tag tdemo">MẪU</span>'
      :c.f97==='Loại trừ'?'<span class="tag" style="background:var(--soft);color:var(--ink3)">Loại trừ</span>'
      :(c.f59==='1. Có'?'<span class="tag tl">LPP</span>':(c.f59==='0. Không'?'<span class="tag tc">Chứng</span>':'<span class="tag tw">?</span>'));
    return '<div class="row"><div class="l" onclick="editCase('+o.i+')"><b>'+(c.f2||'(chưa có mã)')
     +(c._name?' · '+c._name:'')
     +(st.warn?' <span style="color:var(--gold-d)">⚠︎'+st.warn+'</span>':'')+'</b>'
     +'<span>'+(c.f3||'')+' · '+(c.f6||'?')+' tuổi · POAF '
     +(c.f31==='1. Có'?'có':(c.f31==='0. Không'?'không':'?'))

/* ============ DANH MỤC BIẾN ============ */
function varState(f){
  if(!depOK(f)) return 'na';
  if(f.s==='F'&&!unlocked) return 'lock';
  return val(f.k)!=='' ? 'done' : 'todo';
}
function openVars(){
  var ORDER=['S','A','B','H','C','D','E','F','G'];
  var n={done:0,todo:0,na:0,lock:0};
  FIELDS.forEach(function(f){ n[varState(f)]++; });
  var need=n.done+n.todo+n.lock;
  var h='<div class="warn">Danh mục đầy đủ <b>'+FIELDS.length+' biến</b> của ca đang nhập. '
   +'Thẻ <b>xanh</b> đã điền, <b>đỏ</b> chưa điền, xám là không áp dụng. Chạm vào thẻ để nhảy tới ô đó.</div>'
   +'<div class="big" style="grid-template-columns:1fr 1fr 1fr">'
   +'<div class="mcard"><span>Đã điền</span><b style="color:var(--green)">'+n.done+'</b></div>'
   +'<div class="mcard"><span>Chưa điền</span><b style="color:var(--red)">'+(n.todo+n.lock)+'</b></div>'
   +'<div class="mcard"><span>Hoàn tất</span><b>'+Math.round(n.done/(need||1)*100)+'%</b></div>'
   +'</div>';
  ORDER.forEach(function(sec){
    var list=FIELDS.map(function(f,i){return {f:f,j:i+1};}).filter(function(o){return o.f.s===sec;});
    if(!list.length)return;
    h+='<div style="font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px">'+SECT[sec].t+'</div>';
    list.forEach(function(o){
      var f=o.f, st=varState(f), v=val(f.k);
      var bg = st==='done'?'var(--green-l)':(st==='na'?'var(--soft)':'var(--red-l)');
      var bc = st==='done'?'var(--green)':(st==='na'?'var(--line)':'var(--red)');
      var tag= st==='done'?'<span class="tag tl">Đã điền</span>'
        :(st==='na'?'<span class="tag" style="background:var(--soft);color:var(--ink3)">Không áp dụng</span>'
        :(st==='lock'?'<span class="tag tw">Chờ mở mục F</span>':'<span class="tag tc">Chưa điền</span>'));
      var def=(f.hint||'');
      if(f.o) def+=(def?' · ':'')+'Mã hóa: '+f.o.join(' · ');
      else if(f.t==='num') def+=(def?' · ':'')+'Khoảng hợp lý '+f.min+'–'+f.max+(f.u?' '+f.u:'');
      else if(f.t==='calc') def+=(def?' · ':'')+'Tự tính, không nhập tay.';
      h+='<div class="row" style="background:'+bg+';border-color:'+bc+';align-items:flex-start"'
       +(st!=='na'?' onclick="jumpToVar(\''+f.k+'\')"':'')+'>'
       +'<div class="l"><b>'+o.j+'. '+f.n+(f.req?' <span style="color:var(--red)">*</span>':'')
       +(f.u?' <span style="font-weight:400;color:var(--ink3)">('+f.u+')</span>':'')+'</b>'
       +(def?'<span style="display:block;margin-top:3px;line-height:1.45">'+def+'</span>':'')
       +'<span style="display:block;margin-top:5px"><b style="color:var(--ink)">Đã nhập: </b>'+(v||'—')+'</span>'
       +'</div>'+tag+'</div>';
    });
  });
  sheet('Danh mục biến', n.done+'/'+need+' biến đã điền', h);
}
function jumpToVar(k){
  var f=fld(k); if(!f)return;
  closeSheet(); si=SECS.indexOf(f.s); render();
  setTimeout(function(){
    var el=document.getElementById('q_'+k); if(!el)return;
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.add('flag'); setTimeout(function(){el.classList.remove('flag');},2000);
  },90);
}

/* ================= XUẤT ================= */
function headerRow(){return FIELDS.map(function(f){return f.n+(f.u?'\n('+f.u+')':'');});}
function caseRow(c){return FIELDS.map(function(f){var v=c[f.k];
  if(v===undefined||v===null||v==='')return '';
  if(f.k==='f4') return ptvCode(v);
  if(f.t==='num'||f.t==='calc'||f.t==='auto'){var x=parseFloat(String(v).replace(',','.'));return isNaN(x)?v:x;}
  return v;});}
function fmtT(s){if(!s)return '—';var d=new Date(s);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()
   +' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function stamp(){var d=new Date();return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)
  +'_'+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2);}
function exportXlsx(){
  if(!DB.cases.length){toast('Chưa có ca nào');return;}
  var nd=demoCases().length;
  if(nd && !confirm('Có '+nd+' ca mẫu (dữ liệu thử). Các ca này sẽ KHÔNG được đưa vào file Excel.\n\nTiếp tục xuất?')) return;
  if(!realCases().length){toast('Chỉ có ca mẫu — chưa có dữ liệu thật để xuất');return;}
  var rows=[headerRow()]; included().forEach(function(c){rows.push(caseRow(c));});
  var dict=[['Nhóm','Tên biến','Đơn vị','Giá trị / Mã hóa','Định nghĩa và lưu ý']];
  FIELDS.forEach(function(f){
    var oo=f.o?f.o.join(' · '):'';
    if(f.k==='f4'){ oo=f.o.map(ptvCode).join(' · '); }
    dict.push([SECT[f.s].t,f.n,f.u||'',oo,f.k==='f4'?'Mã hóa phẫu thuật viên; bảng đối chiếu tên giữ riêng, không kèm bộ số liệu.':(f.hint||'')]);});
  var l=0,c2=0; included().forEach(function(x){if(x.f59==='1. Có')l++;else if(x.f59==='0. Không')c2++;});
  var meta=[['Thông tin xuất',''],['Thời điểm xuất',fmtT(new Date().toISOString())],
    ['Kho dữ liệu',deviceLabel()],['Số ca đã sàng lọc',realCases().length],['Bị loại trừ',excluded().length],['Được đưa vào nghiên cứu',included().length],['Nhóm LPP',l],['Nhóm chứng',c2],
    ['Cỡ mẫu tối thiểu mỗi nhóm',TARGET],['',''],
    ['Ghi nhận thứ tự làm mù','Thời điểm mở phần biên bản phẫu thuật'],['Mã số','Mở phần F lúc']];
  realCases().forEach(function(x){meta.push([x.f2||'',x._unlockedAt?fmtT(x._unlockedAt):'(nhập trực tiếp)']);});
  var scr=[['STT','Mã số nghiên cứu','Ngày phẫu thuật','Kết luận sàng lọc','Lý do loại trừ','Nhóm']];
  realCases().forEach(function(c,i){ scr.push([i+1,c.f2||'',c.f3||'',c.f97||'',c.f98||'',
    c.f97==='Loại trừ'?'':(c.f59==='1. Có'?'LPP':(c.f59==='0. Không'?'Chứng':''))]); });
  var reasons={}; excluded().forEach(function(c){ String(c.f98||'(không ghi lý do)').split(' · ').forEach(function(x){
    x=x.trim(); if(x)reasons[x]=(reasons[x]||0)+1; }); });
  var flow=[['SƠ ĐỒ DÒNG CHẢY NGHIÊN CỨU',''],['Tổng số ca đã sàng lọc',realCases().length],
    ['Bị loại trừ',excluded().length],['Được đưa vào nghiên cứu',included().length],['',''],
    ['Nhóm LPP',l],['Nhóm chứng',c2],['',''],['LÝ DO LOẠI TRỪ','Số ca']];
  Object.keys(reasons).forEach(function(k){ flow.push([k,reasons[k]]); });
  var lg=[['Thời điểm','Thao tác','Mã số','Kho dữ liệu','Biến thay đổi','Ghi chú']];
  (DB.log||[]).forEach(function(e){
    lg.push([fmtT(e.t),ACT[e.act]||e.act,e.code||'',e.dev||'',
      e.chg?e.chg.map(function(d){return d[1]+': '+(d[2]||'(trống)')+' → '+(d[3]||'(trống)');}).join(' | '):'',
      e.note||'']);
  });
  share(new Blob([buildXlsx([{name:'NhapLieu',rows:rows},{name:'SangLoc',rows:scr},
    {name:'SoDoDongChay',rows:flow},{name:'TuDien',rows:dict},{name:'ThongTin',rows:meta},{name:'NhatKy',rows:lg}])],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
    'POAF_LPP_dulieu_'+stamp()+'.xlsx');
}

  sheet('Xem trước bản xuất', inc.length+' ca × '+hdr.length+' cột', h);
}
function purgeDemo(){
  var n=demoCases().length;
  if(!n){ toast('Không có ca mẫu nào'); return; }
  if(!confirm('Xóa hẳn '+n+' ca mẫu? Không hoàn tác được.\n\nCác ca thật không bị ảnh hưởng.')) return;
  demoCases().forEach(function(c){ c._deletedAt=new Date().toISOString(); DB.trash.push(c); });
  DB.cases=DB.cases.filter(isReal); logAdd('purge','',null,n+' ca mẫu');
  persist(); toast('Đã xóa '+n+' ca mẫu'); openMenu();
}
function backup(){
  deviceLabel();
  var blob=new Blob([JSON.stringify(DB)],{type:'application/json'});
  DB.lastBackup=Date.now(); DB.backupAt=DB.cases.length; persist(); paintDot();
  share(blob,'POAF_LPP_saoluu_'+stamp()+'.json');
  if(document.getElementById('sheet')) openMenu();
}
function share(blob,name){
  var f=null;
  try{ f=new File([blob],name,{type:blob.type}); }catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:name}).then(function(){toast('Đã chia sẻ '+name);}) 
      .catch(function(){dl(blob,name);});
  } else dl(blob,name);
}
function dl(blob,name){
  var a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},600);
  toast('Đã tạo '+name);
}

/* ============ SINH MÃ SỐ NGHIÊN CỨU ============ */
function yy(dstr){
  var m=String(dstr||'').match(/^(\d{4})-/); if(m) return m[1].slice(-2);
  return String(new Date().getFullYear()).slice(-2);
}
function makeCode(){
  var y=yy(val('f3')), max=0;
  allCases().forEach(function(c){
    if(curIdx>=0 && c===DB.cases[curIdx]) return;
    var m=String(c.f2||'').match(/^CR(\d{2})-(\d+)$/);
    if(m&&m[1]===y){ var n=parseInt(m[2],10); if(n>max)max=n; }
  });
  return 'CR'+y+'-'+('00'+(max+1)).slice(-3);
}
function genCode(){
  cur.f2=makeCode(); recompute(); save(); render();
  toast('Đã tạo mã '+cur.f2+(val('f3')?'':' — theo năm hiện tại, nhập ngày mổ để chắc chắn'));
}
/* Chuan hoa ma so nghien cuu */
function normCode(){
  var raw=String(cur.f2||'').trim().replace(/\s+/g,'').toUpperCase();
  if(!raw) return;
  var y=yy(val('f3')), yr=null, num=null, m;
  if((m=raw.match(/^CR?(\d{2})[-–—](\d{1,4})$/))){ yr=m[1]; num=m[2]; }
  else if((m=raw.match(/^(\d{2})[-–—](\d{1,4})$/))){ yr=m[1]; num=m[2]; }
  else if((m=raw.match(/^(?:CR)?(\d{1,4})$/))){ yr=y; num=m[1]; }
  if(num===null) return;
  var ns=String(parseInt(num,10)); while(ns.length<3) ns='0'+ns;
  var code='CR'+yr+'-'+ns;
  if(code===cur.f2) return;
  cur.f2=code;
  var el=document.getElementById('i_f2'); if(el) el.value=code;
  var dup=DB.cases.some(function(c,i){ return i!==curIdx && c.f2===code; });
  recompute(); paintFieldStates(); save();
  toast(dup ? ('Mã '+code+' đã có ở ca khác') : ('Mã số: '+code));
}

/* ============ GỘP DỮ LIỆU THEO MÃ SỐ ============ */
function codeOf(c){ return String(c && c.f2 || '').trim().toUpperCase(); }
function tOf(c){ var t=c && c._savedAt ? Date.parse(c._savedAt) : 0; return isNaN(t)?0:t; }
function mergeReport(inc){
  var mine={}, R={add:[],upd:[],keep:[],nocode:[],dupIn:[]};
  DB.cases.forEach(function(c,i){ var k=codeOf(c); if(k) mine[k]=i; });
  var seen={};
  inc.forEach(function(c){
    var k=codeOf(c);
    if(!k){ R.nocode.push(c); return; }
    if(seen[k]){ R.dupIn.push(k); return; }
    seen[k]=1;
    if(mine[k]===undefined){ R.add.push(c); return; }
    var old=DB.cases[mine[k]];
    if(tOf(c)>tOf(old)) R.upd.push({c:c,i:mine[k],code:k});
    else R.keep.push(k);
  });
  return R;
}
function applyMerge(inc){
  var R=mergeReport(inc);
  R.upd.forEach(function(o){ DB.cases[o.i]=o.c; });
  R.add.forEach(function(c){ DB.cases.push(c); });
  R.nocode.forEach(function(c){ DB.cases.push(c); });
  DB.cases.sort(function(a,b){ return tOf(a)-tOf(b); });
  DB.cases.forEach(function(c,i){ c.f1=String(i+1); });
  persist();
  return R;
}
function restore(inp){
  var f=inp.files[0]; if(!f)return; var r=new FileReader();
  r.onload=function(){
    var o;
    try{ o=JSON.parse(r.result); }catch(e){ toast('File sao lưu không đọc được'); return; }
    var inc = o && o.cases ? o.cases : (Array.isArray(o)?o:null);
    if(!inc){ toast('File này không phải bản sao lưu của app'); return; }
    window._pending={cases:inc,raw:o,name:f.name};
    mergeSheet();
  };
  r.readAsText(f); inp.value='';
}
function mergeSheet(){
  var P=window._pending, inc=P.cases, R=mergeReport(inc);
  var h='<div class="card"><h3>'+P.name+'</h3><p>File chứa <b>'+inc.length+'</b> ca'
   +(P.raw&&P.raw.device?' · từ kho <b>'+P.raw.device+'</b>':'')+'.<br>'
   +'Thiết bị này đang có <b>'+DB.cases.length+'</b> ca ở kho <b>'+deviceLabel()+'</b>.</p></div>';
  h+='<div class="card"><h3>Nếu chọn Gộp</h3><p>'
   +'<b style="color:var(--green)">Thêm mới '+R.add.length+' ca</b> — chưa có mã này trên máy.<br>'
   +'<b style="color:var(--gold-d)">Cập nhật '+R.upd.length+' ca</b> — trùng mã, bản trong file lưu sau nên thay bản cũ.<br>'
   +'<b>Giữ nguyên '+R.keep.length+' ca</b> — trùng mã nhưng bản trên máy mới hơn.'
   +(R.nocode.length?'<br><b style="color:var(--red)">'+R.nocode.length+' ca không có mã số</b> — vẫn thêm vào, cần kiểm tra lại.':'')
   +(R.dupIn.length?'<br><b style="color:var(--red)">'+R.dupIn.length+' mã lặp trong chính file</b> — chỉ lấy bản đầu.':'')
   +'</p></div>';
  if(R.upd.length) h+='<div class="warn"><b>Các ca sẽ bị ghi đè:</b><br>'+R.upd.map(function(o){return o.code;}).join(' · ')+'</div>';
  h+='<div class="card"><h3>Sau khi gộp</h3><p>Tổng cộng <b>'+(DB.cases.length+R.add.length+R.nocode.length)+'</b> ca.</p></div>';
  h+='<div class="act">'
   +'<button class="a1" onclick="doMerge()">Gộp vào — giữ cả hai bên</button>'
   +'<button class="a2" onclick="doReplace()">Thay thế toàn bộ bằng file này</button>'
   +'<button class="a2" onclick="closeSheet()">Hủy</button></div>'
   +'<div class="warn">“Thay thế” sẽ xóa sạch '+DB.cases.length+' ca đang có trên thiết bị này. Chỉ dùng khi chắc chắn.</div>';
  sheet('Nạp file sao lưu','Chọn cách xử lý',h);
}
function doMerge(){
  var P=window._pending; if(!P)return;
  var R=applyMerge(P.cases);
  if(P.raw&&P.raw.lastBackup) DB.lastBackup=Math.max(DB.lastBackup||0,P.raw.lastBackup);
  persist(); window._pending=null;
  var h='<div class="card"><h3>Đã gộp xong</h3><p>'
   +'Thêm mới <b>'+R.add.length+'</b> ca<br>Cập nhật <b>'+R.upd.length+'</b> ca<br>Giữ nguyên <b>'+R.keep.length+'</b> ca'
   +(R.nocode.length?'<br>Thêm <b>'+R.nocode.length+'</b> ca không có mã số':'')
   +'</p><p>Tổng hiện có <b>'+DB.cases.length+'</b> ca. Số thứ tự đã đánh lại từ 1.</p></div>'
   +'<div class="act"><button class="a3" onclick="openMenu()">Xem danh sách ca</button>'
   +'<button class="a2" onclick="backup()">Sao lưu ngay bản đã gộp</button></div>';
  sheet('Kết quả gộp', DB.cases.length+' ca', h);
  toast('Đã gộp — tổng '+DB.cases.length+' ca');
}
function doReplace(){
  var P=window._pending; if(!P)return;
  if(!confirm('Xóa sạch '+DB.cases.length+' ca đang có và thay bằng '+P.cases.length+' ca trong file?')) return;
  var dev=DB.device;
  DB = (P.raw&&P.raw.cases) ? P.raw : {cases:P.cases};
  if(!DB.cases)DB.cases=[]; DB.device=dev;
  DB.cases.forEach(function(c,i){c.f1=String(i+1);});
  DB.draft=null; persist(); window._pending=null;
  toast('Đã thay thế — '+DB.cases.length+' ca'); newCase();
}

/* ---- vuốt trái/phải để chuyển mục ---- */
(function(){
  var x0=null,y0=null,t0=0;
  var b=document.getElementById('body');
  b.addEventListener('touchstart',function(e){ if(e.touches.length!==1)return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
  b.addEventListener('touchend',function(e){
    if(x0===null)return; var t=e.changedTouches[0];
    var dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    x0=null;
    if(dt>600||Math.abs(dx)<70||Math.abs(dy)>50)return;
    if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
    if(dx<0) nextSec(); else prevSec();
  },{passive:true});
})();
